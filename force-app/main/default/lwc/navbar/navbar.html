<template>
    <header class="navbar">
        <div class="nav-container">
            <a href="#" class="logo" onclick={handleLogoClick}>
                N<span class="dot">.</span>
            </a>
            <nav class={navLinksClass}>
                <button class={aboutClass} type="button" data-section="about" onclick={handleNavigation}>About</button>
                <button class={skillsClass} type="button" data-section="skills"
                    onclick={handleNavigation}>Skills</button>
                <button class={projectsClass} type="button" data-section="projects"
                    onclick={handleNavigation}>Projects</button>
                <button class={certificationsClass} type="button" data-section="certifications"
                    onclick={handleNavigation}>Certifications</button>
                <button class={experienceClass} type="button" data-section="experience"
                    onclick={handleNavigation}>Experience</button>
                <button class={contactClass} type="button" data-section="contact"
                    onclick={handleNavigation}>Contact</button>
            </nav>

            <div class="nav-actions">
                <button class="resume-btn" type="button" onclick={openResume}>Resume</button>
            </div>

            <button class={hamburgerClass} type="button" onclick={toggleMenu} aria-label="Toggle navigation menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <template if:true={showResumeModal}>
        <div class="resume-modal-backdrop" onclick={closeResumeModal}>
            <div class="resume-modal" role="dialog" aria-modal="true" onclick={stopPropagation}>

                <button class="back-btn" type="button" onclick={closeResumeModal}>
                    <span class="back-arrow">←</span>Back
                </button>

                <div class="resume-modal-header">
                    <span class="modal-title">Resume</span>
                    <div class="resume-modal-actions">
                        <a href={rawResumeUrl} download={resumeFileName} class="download-btn" target="_blank"
                            rel="noopener noreferrer">
                            Download
                        </a>
                    </div>
                </div>

                <div class="resume-modal-body">
                    <template if:true={isLoadingPdf}>
                        <div class="resume-status">
                            <div class="spinner"></div>
                        </div>
                    </template>
                    <iframe class="document-frame" src={pdfViewerUrl} title="Resume PDF Preview"></iframe>
                </div>

            </div>
        </div>
    </template>
</template>
