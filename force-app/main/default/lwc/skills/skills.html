<template>
    <c-scroll-reveal>
        <section class="skills" id="skills">
            <h2 class="title">
                Technical Skills
            </h2>

            <div class="skills-grid">
                <template for:each={skills} for:item="skill">
                    <div class="skill-card" key={skill.name}>
                        <div class="icon" aria-hidden="true">
                            {skill.icon}
                        </div>

                        <h3>
                            {skill.name}
                        </h3>

                        <p>
                            {skill.description}
                        </p>

                        <div class="tags">
                            <template for:each={skill.tools} for:item="tool">
                                <span key={tool}>
                                    {tool}
                                </span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </c-scroll-reveal>
</template>
