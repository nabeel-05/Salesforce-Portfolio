<template>
    <c-scroll-reveal>
        <section class="timeline-section" id="experience">
            <h2 class="title">
                Experience
            </h2>

            <div class="timeline">
                <template for:each={items} for:item="item">
                    <div class="timeline-item" key={item.id}>
                        <div class="dot"></div>

                        <div class="card">
                            <div class="icon" aria-hidden="true">
                                {item.icon}
                            </div>

                            <h3>
                                {item.title}
                            </h3>

                            <span class="date">
                                {item.date}
                            </span>

                            <p>
                                {item.description}
                            </p>

                            <div class="tags">
                                <template for:each={item.skills} for:item="skill">
                                    <span key={skill}>
                                        {skill}
                                    </span>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </c-scroll-reveal>
</template>
