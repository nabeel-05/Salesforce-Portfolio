<template>

    <c-scroll-reveal>

        <section class="timeline-section" id="experience">



            <h2 class="title">
                Experience
            </h2>


            <div class="timeline">


                <template for:each={items} for:item="item">


                    <div class="timeline-item" key={item.id}>


                        <div class="dot"></div>


                        <div class="card">
                            <!-- Added aria-hidden to prevent screen readers from reading emojis -->
                            <div class="icon" aria-hidden="true">
                                {item.icon}
                            </div>

                            <h3>
                                {item.title}
                            </h3>

                            <span class="date">
                                {item.date}
                            </span>
                            <!-- ... rest of your template ... -->
                        </div>


                    </div>


                </template>


            </div>


        </section>

    </c-scroll-reveal>


</template>
